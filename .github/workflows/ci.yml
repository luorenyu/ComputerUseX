name: CI & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (macOS Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run Unit Tests
        run: swift test

      - name: Build Release App Bundle & CLI
        run: ./scripts/build-app.sh

      - name: Verify CLI Diagnostics
        run: ./dist/cux --help

      - name: Package Release Archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          zip -r ComputerUseX-macos-arm64.zip ComputerUseX.app cux

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerUseX-macos-arm64
          path: |
            dist/ComputerUseX.app
            dist/cux
