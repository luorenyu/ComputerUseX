name: CI & Release Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (macOS Swift 6)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift version
        run: swift --version

      - name: Run Unit Tests
        run: swift test

      - name: Build Release App Bundle & CLI
        run: ./scripts/build-app.sh

      - name: Verify CLI Diagnostics
        run: ./dist/cux --help

      - name: Package Release Archive
        run: |
          cd dist
          zip -qry ComputerUseX-macos-arm64.zip ComputerUseX.app cux

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerUseX-macos-arm64
          path: dist/ComputerUseX-macos-arm64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ComputerUseX-macos-arm64.zip
